      - description: Event ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete event
      tags:
      - Events
    get:
      description: Returns events with optional year, month, tag, limit, sort, and
        user_id filters
      parameters:
      - description: Filter by year
        in: query
        name: year
        type: string
      - description: Filter by month (01-12)
        in: query
        name: month
        type: string
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Limit results
        in: query
        name: limit
        type: integer
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: timeline events
          schema:
            items:
              type: object
            type: array
      summary: Get timeline events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Creates a new event or updates an existing one
      parameters:
      - description: Event data
        in: body
        name: event
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: saved event
          schema:
            type: object
        "400":
          description: Bad Request
