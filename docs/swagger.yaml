  contact: {}
paths:
  /auto-tag:
    post:
      consumes:
      - application/json
      description: Automatically generates tags for an event using AI/Ollama
      parameters:
      - description: Auto-tag request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Auto-tag event
      tags:
      - Events
  /autocomplete:
    get:
      description: Returns autocomplete suggestions for location, person, tag, media,
        or user fields
      parameters:
      - description: Field to autocomplete
        enum:
        - location
        - person
        - tag
        - media
        - user
        in: query
        name: field
        required: true
        type: string
      - description: Search prefix
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Autocomplete suggestions
      tags:
      - Events
  /backup:
    post:
      description: Creates a database backup
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create backup
      tags:
      - System
  /backup/config:
    get:
      description: Gets the backup configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BackupConfig'
      summary: Get backup config
      tags:
      - System
    post:
      consumes:
      - application/json
      description: Saves the backup configuration
      parameters:
      - description: Backup config
        in: body
        name: config
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save backup config
      tags:
      - System
  /backups:
    get:
      description: Lists all database backups
      produces:
      - application/json
      responses:
        "200":
          description: backups
          schema:
            items:
              type: object
            type: array
      summary: List backups
      tags:
      - System
  /calendar:
    get:
      description: Returns events grouped by date for calendar view
      produces:
      - application/json
      responses:
        "200":
          description: calendar data
          schema:
            type: object
      summary: Get calendar data
      tags:
      - Events
  /check-setup:
    get:
      description: Check if admin has been configured
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Check setup status
      tags:
      - Info
  /collections:
    delete:
      description: Deletes a collection by ID
      parameters:
      - description: models.Collection ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete collection
      tags:
      - models.Collections
    get:
      description: Returns all collections with event counts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Collection'
            type: array
      summary: Get collections
      tags:
      - models.Collections
    post:
      consumes:
      - application/json
      description: Creates a new collection or updates an existing one
      parameters:
      - description: models.Collection data
        in: body
        name: collection
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Collection'
      summary: Create or update collection
      tags:
      - models.Collections
  /collections/{id}/events:
    delete:
      description: Remove an event from a collection
      parameters:
      - description: models.Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: Event ID
        in: query
        name: event_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove event from collection
      tags:
      - models.Collections
    get:
      description: Returns all events for a given collection
      parameters:
      - description: models.Collection ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TimelineEvent'
            type: array
      summary: Get events in a collection
      tags:
      - models.Collections
    post:
      consumes:
      - application/json
      description: Add an event to a collection
      parameters:
      - description: models.Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: Event ID
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add event to collection
      tags:
      - models.Collections
