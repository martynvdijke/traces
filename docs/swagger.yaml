  /events/import:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Import events from JSON or CSV format
      parameters:
      - description: Import format
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: CSV file (for CSV format)
        in: formData
        name: file
        type: file
      - description: Events array (for JSON format)
        in: body
        name: events
        schema:
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
