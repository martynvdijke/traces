<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACES - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script>
      (function(){var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: var(--bg-card);
            --card-text: var(--text);
            --input-bg: var(--bg-card);
            --input-border: var(--border);
            --input-text: var(--text);
            --muted: var(--text-muted);
        }
        [data-theme="dark"] {
            --card-bg: var(--bg-card);
            --card-text: var(--text);
            --input-bg: var(--bg-card);
            --input-border: var(--border);
            --input-text: var(--text);
            --muted: var(--text-muted);
        }
        body {
            background: var(--gradient-hero);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.15rem;
            padding: var(--space-xl) var(--space-md);
        }
        .login-main {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--elevation-lg);
            padding: 2.2rem 2rem 1.9rem;
            width: 100%;
            max-width: 400px;
            color: var(--card-text);
        }
        /* — lockup: matches index header (sans 800 + mono tagline) — */
        .login-logo {
            text-align: center;
            margin-bottom: 1.6rem;
        }
        .login-logo img {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            box-shadow: 0 4px 16px var(--shadow-md), 0 1px 4px var(--shadow-sm);
            display: block;
            margin: 0 auto;
        }
        .login-logo h1 {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 1.55rem;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--text);
            margin: 0.85rem 0 0.2rem;
        }
        .login-logo h1::after {
            content: '';
            display: block;
            width: 28px;
            height: 3px;
            border-radius: 999px;
            background: var(--gradient);
            margin: 0.55rem auto 0;
            opacity: 0.9;
        }
        .login-logo .text-muted {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted) !important;
            margin-top: 0.65rem;
        }
        /* — form controls — */
        .form-label {
            font-size: 0.78rem;
            font-weight: 650;
            letter-spacing: 0.02em;
            color: var(--card-text);
            margin-bottom: 0.35rem;
            font-family: var(--font-sans);
        }
        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--input-text);
            font-size: 0.93rem;
            font-family: var(--font-sans);
            min-height: 44px;
            padding: 0.62rem 0.9rem;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: var(--muted);
            opacity: 0.9;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: var(--input-bg);
            color: var(--input-text);
        }
        /* autofill — neutralize harsh yellow/blue on cream */
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus,
        .form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
            -webkit-text-fill-color: var(--input-text) !important;
            caret-color: var(--input-text);
            transition: background-color 9999s ease-out 0s;
        }
        /* — buttons — */
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            border-radius: 999px;
            min-height: 44px;
            padding: 0.62rem 1.1rem;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 16px var(--shadow-md);
            transition: background 0.18s, border-color 0.18s, transform 0.15s, box-shadow 0.18s;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--shadow-md);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px var(--shadow-sm);
        }
        .btn-primary:disabled,
        .btn-primary.disabled {
            opacity: 0.62;
            transform: none;
            box-shadow: none;
            pointer-events: none;
        }
        .btn-primary:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        /* Authelia / secondary outline — injected as .btn-outline-primary */
        .btn-outline-primary {
            border-radius: 999px;
            min-height: 44px;
            padding: 0.58rem 1.1rem;
            font-weight: 650;
            font-size: 0.88rem;
            letter-spacing: 0.01em;
            border-width: 1.5px;
            border-color: var(--border);
            color: var(--card-text);
            background: var(--card-bg);
            transition: border-color 0.18s, color 0.18s, background 0.18s, transform 0.15s;
        }
        .btn-outline-primary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-glow);
            transform: translateY(-1px);
        }
        .btn-outline-primary:active {
            transform: translateY(0);
        }
        .btn-outline-primary:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        /* — error alert — warm, both themes — */
        .alert-danger,
        #login-error.alert {
            background: var(--bs-primary-bg-subtle);
            border: 1px solid var(--bs-primary-border-subtle);
            color: var(--bs-primary-text-emphasis);
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            font-weight: 500;
            line-height: 1.45;
            padding: 0.7rem 0.85rem;
        }
        [data-theme="dark"] .alert-danger,
        [data-theme="dark"] #login-error.alert {
            background: var(--bs-primary-bg-subtle);
            border-color: var(--bs-primary-border-subtle);
            color: var(--bs-primary-text-emphasis);
        }
        .alert-danger:empty { display: none; }
        /* — demo account — */
        .demo-login {
            margin-top: 1.1rem;
            padding-top: 1.05rem;
            border-top: 1px dashed var(--border);
        }
        .demo-login__kicker {
            margin-bottom: 0.6rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--primary);
        }
        [data-theme="dark"] .demo-login__kicker { color: var(--primary-light); }
        .demo-login__hint {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.25rem 0.95rem;
            margin-top: 0.6rem;
            font-size: 0.68rem;
            color: var(--muted);
        }
        .demo-login__cred {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            min-width: 0;
        }
        .demo-login code {
            max-width: 12rem;
            padding: 0.08rem 0.3rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--text);
            overflow-wrap: anywhere;
        }
        /* — compact legal footer on the gradient — */
        .login-footer {
            position: static;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.35rem 1.1rem;
            width: 100%;
            max-width: 430px;
            margin: 0;
            padding: 0;
            background: transparent;
            border-top: 0;
        }
        .login-footer::before { display: none; }
        .login-footer a {
            padding: 0.3rem 0.15rem;
            border-radius: 4px;
            color: rgba(253, 246, 236, 0.76);
            font-family: var(--font-mono);
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
        }
        .login-footer a:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
        .login-footer a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .login-footer .login-footer__home { color: #fff; }
        .skip-link {
            position: fixed;
            top: -4.5rem;
            left: 1rem;
            z-index: 1001;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: var(--elevation-md);
            transition: top 0.16s ease;
        }
        .skip-link:focus { top: 0.85rem; }
        /* — theme toggle on gradient-hero — */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--card-text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            z-index: 10;
            transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s;
            box-shadow: 0 4px 18px var(--shadow-md), 0 1px 6px var(--shadow-sm);
        }
        .theme-toggle:hover {
            background: var(--primary-glow);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .theme-toggle:active { transform: translateY(0) scale(0.97); }
        .theme-toggle:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        /* sit legibly on dark gradient in both themes */
        [data-theme="dark"] .theme-toggle {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,255,255,0.16);
            color: white;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        [data-theme="dark"] .theme-toggle:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.28);
            color: white;
        }
        .text-muted { color: var(--muted) !important; }
        @media (max-width: 480px) {
            body { padding: var(--space-md) var(--space-sm); }
            .login-card { padding: 1.7rem 1.25rem 1.5rem; border-radius: var(--radius-md); }
            .login-logo img { width: 52px; height: 52px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to sign-in form</a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
    </button>
    <main class="login-main" id="main" tabindex="-1">
    <div class="login-card">
        <div class="login-logo">
            <img src="/static/logo.svg" alt="TRACES">
            <h1>TRACES</h1>
            <p class="text-muted">Sign in to manage events</p>
        </div>
        <form id="login-form">
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
                <label class="form-label" for="login-username">Username</label>
                <input type="text" class="form-control" id="login-username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="login-password">Password</label>
                <input type="password" class="form-control" id="login-password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-sign-in-alt me-2" aria-hidden="true"></i> Sign In
            </button>
        </form>
        <p style="text-align:center;margin-top:1rem;font-size:0.85rem"><a href="#" id="forgot-link">Forgot password?</a></p>
        <div id="forgot-section" class="d-none" style="margin-top:1rem">
            <div id="forgot-msg" class="alert d-none" role="alert"></div>
            <form id="forgot-form">
                <label class="form-label" for="forgot-email">Email or username</label>
                <input type="text" class="form-control mb-2" id="forgot-email" name="email" placeholder="you@example.com" required>
                <button type="submit" class="btn btn-primary w-100">Send reset link</button>
            </form>
        </div>
        <div id="demo-login" class="demo-login d-none">
            <p class="demo-login__kicker"><i class="fa-solid fa-circle-play me-1" aria-hidden="true"></i> Try the demo</p>
            <button type="button" class="btn btn-outline-primary w-100" id="demo-login-btn" aria-describedby="demo-credentials">
                <i class="fa-solid fa-user-astronaut me-2" aria-hidden="true"></i> Use the demo account
            </button>
            <p class="demo-login__hint" id="demo-credentials">
                <span class="demo-login__cred">Username <code id="demo-username"></code></span>
                <span class="demo-login__cred">Password <code id="demo-password"></code></span>
            </p>
        </div>
    </div>
    </main>
    <footer class="login-footer">
        <a class="login-footer__home" href="/">Back to TRACES</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/account/delete">Delete account</a>
    </footer>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');t=t==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);document.getElementById('theme-icon').className=t==='dark'?'fa-solid fa-sun':'fa-solid fa-moon'}
      document.addEventListener('DOMContentLoaded',function(){var t=document.documentElement.getAttribute('data-theme');document.getElementById('theme-icon').className=t==='dark'?'fa-solid fa-sun':'fa-solid fa-moon'});
    </script>
    <script>
    document.getElementById('forgot-link')?.addEventListener('click', function(e){e.preventDefault();document.getElementById('forgot-section').classList.toggle('d-none')});
    document.getElementById('forgot-form')?.addEventListener('submit', async function(e){
      e.preventDefault();
      const fd=new FormData(e.target);
      const val=fd.get('email');
      const msg=document.getElementById('forgot-msg');
      try{
        const res=await fetch('/api/request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:val, username:val})});
        msg.textContent='If an account exists, a reset link has been sent.';
        msg.className='alert alert-success';
        msg.classList.remove('d-none');
      }catch(err){msg.textContent='Request failed: '+err.message;msg.className='alert alert-danger';msg.classList.remove('d-none');}
    });
    </script>
    <script type="module" src="/static/js/login.js"></script>
</body>
</html>
