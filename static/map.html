<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACES - Map View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); background: var(--bg); color: var(--text); }
        .map-header { background: var(--gradient-hero); color: white; padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.12); position: sticky; top: 0; z-index: 1000; }
        .map-header h1 { font-size: var(--text-lg); font-family: var(--font-mono); font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .map-container { display: flex; height: calc(100vh - 57px); }
        #map { flex: 1; height: 100%; background: #eef2f7; }
        .map-sidebar { width: 350px; background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 1rem; }
        .map-sidebar h3 { font-size: var(--text-md); font-weight: 700; margin-bottom: 1rem; color: var(--primary); font-family: var(--font-mono); }
        .event-marker-item { background: var(--bg-card); border-radius: var(--radius-sm); padding: 0.75rem; margin-bottom: 0.5rem; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; }
        .event-marker-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px var(--shadow-md); }
        .event-marker-item .date { font-size: var(--text-xs); color: var(--primary); font-weight: 600; font-family: var(--font-mono); }
        .event-marker-item .title { font-size: var(--text-sm); font-weight: 600; }
        .event-marker-item .location { font-size: var(--text-xs); color: var(--text-muted); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 2rem; }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; }
        @media (max-width: 768px) {
            .map-container { flex-direction: column; }
            .map-sidebar { width: 100%; max-height: 200px; border-left: none; border-top: 1px solid var(--border); }
            #map { height: calc(100vh - 57px - 200px); }
        }
    </style>
</head>
<body>
    <header class="map-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="fa-solid fa-map me-2" aria-hidden="true"></i>TRACES MAP</h1>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-clock me-1" aria-hidden="true"></i> Timeline</a>
                <a href="/admin.html" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-gear me-1" aria-hidden="true"></i> Admin</a>
            </div>
        </div>
    </header>
    <div class="map-container">
        <div id="map"></div>
        <div class="map-sidebar" id="sidebar">
            <h3><i class="fa-solid fa-list me-2" aria-hidden="true"></i>Events on Map</h3>
            <div class="mb-3">
                <input type="text" class="form-control form-control-sm" id="location-filter" placeholder="Filter by location..." autocomplete="off">
            </div>
            <p class="small text-muted mb-2">This is the canonical map (Carto <code>light_all</code> + clustering) — also available as the Map overlay on <a href="/#map">Timeline → Map</a>. Share a location with <code>?lat=&amp;lng=&amp;zoom=&amp;id=</code>.</p>
            <div id="event-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="/static/js/map.js"></script>
</body>
</html>
