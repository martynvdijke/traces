<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACES - Map View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

        /* ── Header: warm editorial hero, matches index story-toolbar feel ── */
        .map-header {
            background: var(--gradient-hero);
            color: white;
            padding: 0.70rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.10);
            position: sticky;
            top: 0;
            z-index: 1100;
            box-shadow: 0 8px 32px rgba(20,12,24,0.28);
            overflow: hidden;
            isolation: isolate;
        }
        .map-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(60% 140% at 88% 0%, rgba(255,255,255,0.08), transparent 62%);
            pointer-events: none;
            z-index: -1;
        }
        .map-header > .d-flex { gap: 0.75rem 1rem; min-width: 0; }
        .map-header h1 {
            display: inline-flex;
            align-items: center;
            gap: 0.62rem;
            font-size: 0.88rem;
            font-family: var(--font-mono);
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
        }
        .map-header h1 i {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.14);
            font-size: 0.84rem;
            flex-shrink: 0;
            backdrop-filter: blur(6px);
        }
        .map-header .btn {
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.38rem 0.85rem;
            font-family: var(--font-sans);
            line-height: 1.2;
            transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s, box-shadow 0.18s;
        }
        .map-header .btn-outline-light {
            color: rgba(255,255,255,0.94);
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.26);
            backdrop-filter: blur(6px);
        }
        .map-header .btn-outline-light:hover {
            background: rgba(255,255,255,0.14);
            border-color: white;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
        }
        .map-header .btn-outline-light:active { transform: translateY(0); }
        .map-header .btn-outline-light:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        /* ── Layout ── */
        .map-container {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-md);
            height: calc(100vh - 58px);
            min-height: 0;
            background: var(--bg);
            align-items: stretch;
        }
        #map {
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
            min-height: 320px;
            background:
                radial-gradient(42% 58% at 28% 28%, var(--primary-glow), transparent 68%),
                radial-gradient(36% 52% at 82% 78%, rgba(0,0,0,0.03), transparent 66%),
                linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--elevation-sm);
            position: relative;
            z-index: 1;
        }
        #map .leaflet-container {
            background: var(--bg-card);
            font-family: var(--font-sans);
            border-radius: var(--radius-lg);
        }
        /* keep controls crisp inside rounded frame */
        .leaflet-control-zoom {
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-sm) !important;
            overflow: hidden;
            box-shadow: var(--elevation-sm) !important;
        }
        .leaflet-control-zoom a {
            color: var(--text) !important;
            background: var(--bg-card) !important;
            border-bottom-color: var(--border) !important;
            font-family: var(--font-mono);
        }
        .leaflet-control-zoom a:hover { background: var(--bg) !important; color: var(--primary) !important; }
        .leaflet-control-attribution {
            background: rgba(255,255,255,0.82) !important;
            color: var(--text-muted) !important;
            font-family: var(--font-mono);
            font-size: 0.62rem !important;
            padding: 2px 6px !important;
            border-radius: 8px 0 0 0;
            backdrop-filter: blur(6px);
        }
        [data-theme="dark"] .leaflet-control-attribution {
            background: rgba(30,26,36,0.86) !important;
            color: var(--text-muted) !important;
        }
        .map-marker-icon { background: transparent; border: none; }
        /* warm cluster */
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: var(--primary-glow) !important;
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: var(--primary) !important;
            color: white !important;
            font-family: var(--font-mono);
            font-weight: 700;
        }
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius) !important;
            box-shadow: var(--elevation-md) !important;
            border: 1px solid var(--border);
        }
        .leaflet-popup-content { font-family: var(--font-sans); line-height: 1.45; margin: 10px 14px !important; }
        .leaflet-popup-tip { border: 1px solid var(--border); }

        /* ── Sidebar: white/ink card on cream paper ── */
        .map-sidebar {
            width: 368px;
            flex: 0 0 368px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow-y: auto;
            padding: var(--space-lg);
            box-shadow: var(--elevation-sm);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .map-sidebar::-webkit-scrollbar { width: 6px; }
        .map-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
        .map-sidebar h3 {
            font-size: 0.68rem;
            font-weight: 800;
            margin: 0;
            color: var(--text);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            line-height: 1;
        }
        .map-sidebar h3 i { color: var(--primary); font-size: 0.78rem; opacity: 0.95; flex-shrink: 0; }
        .map-sidebar .mb-3 { margin-bottom: 0 !important; position: relative; }
        .map-sidebar .mb-3::before {
            content: '\f002';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.74rem;
            color: var(--text-muted);
            opacity: 0.62;
            pointer-events: none;
            z-index: 1;
        }
        #location-filter {
            border-radius: 999px;
            font-size: var(--text-sm);
            padding: 0.52rem 0.9rem 0.52rem 2.25rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
            box-shadow: none;
        }
        #location-filter::placeholder { color: var(--text-muted); opacity: 0.72; }
        #location-filter:hover { border-color: var(--border); background: var(--bg-card); }
        #location-filter:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: var(--bg-card);
            outline: none;
        }
        /* helper note */
        .map-sidebar .small.text-muted {
            font-size: 0.70rem;
            line-height: 1.6;
            color: var(--text-muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.60rem 0.75rem;
            margin-bottom: 0 !important;
        }
        .map-sidebar .small.text-muted a { color: var(--primary); font-weight: 650; text-underline-offset: 2px; }
        .map-sidebar .small.text-muted code {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.12rem 0.32rem;
            border-radius: 6px;
            font-size: 0.66rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* ── Event list ── */
        #event-list { display: flex; flex-direction: column; gap: 0.55rem; }
        .event-marker-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 0.85rem 0.95rem;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s, background 0.18s;
            display: flex;
            flex-direction: column;
            gap: 0.22rem;
            position: relative;
        }
        .event-marker-item:hover {
            border-color: var(--primary);
            box-shadow: 0 6px 22px var(--shadow-sm);
            transform: translateY(-1px);
            background: var(--bg-card);
        }
        .event-marker-item:active { transform: translateY(0); }
        .event-marker-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .event-marker-item.is-active,
        .event-marker-item.is-selected { border-color: var(--primary); background: var(--primary-glow); box-shadow: 0 0 0 3px var(--primary-glow); }
        .event-marker-item .date {
            font-size: 0.66rem;
            color: var(--primary);
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.28rem;
            line-height: 1.2;
        }
        .event-marker-item .date i { opacity: 0.9; font-size: 0.66rem; }
        .event-marker-item .title {
            font-size: var(--text-sm);
            font-weight: 750;
            line-height: 1.35;
            letter-spacing: -0.015em;
            color: var(--text);
            overflow-wrap: anywhere;
        }
        .event-marker-item .location {
            font-size: 0.73rem;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 0.30rem;
            line-height: 1.45;
            font-weight: 500;
        }
        .event-marker-item .location i { color: var(--primary); opacity: 0.78; font-size: 0.68rem; flex-shrink: 0; }
        .event-marker-item .badge {
            margin-top: 0.30rem;
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 0.60rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.24rem 0.52rem;
            border-radius: 999px;
            line-height: 1;
        }

        /* ── Empty state: warm intentional ── */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: var(--space-xl) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.55rem;
            line-height: 1.65;
        }
        .empty-state i {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-glow);
            color: var(--primary);
            border: 1px solid var(--border);
            font-size: 1.15rem;
            margin: 0 0 0.15rem 0;
            opacity: 1;
        }
        .empty-state p {
            font-size: var(--text-sm);
            font-weight: 750;
            color: var(--text);
            margin: 0;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }
        .empty-state small {
            font-size: var(--text-xs);
            line-height: 1.65;
            color: var(--text-muted);
            max-width: 26ch;
            display: block;
        }

        /* dark tweaks */
        [data-theme="dark"] .map-header { border-bottom-color: rgba(255,255,255,0.08); }
        [data-theme="dark"] #map { background: linear-gradient(180deg, var(--bg-card) 0%, var(--dark-surface) 100%); border-color: var(--border); }
        [data-theme="dark"] .map-sidebar { background: var(--bg-card); border-color: var(--border); }
        [data-theme="dark"] #location-filter { background: var(--bg); border-color: var(--border); }
        [data-theme="dark"] #location-filter:focus { background: var(--dark-surface); }
        [data-theme="dark"] .map-sidebar .small.text-muted { background: var(--bg); }
        [data-theme="dark"] .map-sidebar .small.text-muted code { background: var(--dark-surface); }
        [data-theme="dark"] .empty-state { background: var(--bg-card); }
        [data-theme="dark"] .empty-state i { background: rgba(181,69,43,0.16); border-color: var(--border); }

        @media (max-width: 768px) {
            .map-header { padding: 0.60rem 0.85rem; }
            .map-header h1 { font-size: 0.82rem; letter-spacing: 0.11em; }
            .map-header h1 i { width: 26px; height: 26px; font-size: 0.76rem; }
            .map-container { flex-direction: column; gap: var(--space-sm); padding: var(--space-sm); height: auto; min-height: calc(100vh - 54px); }
            .map-sidebar { width: 100%; flex: none; max-height: 44vh; border-radius: var(--radius); padding: var(--space-md); order: 2; }
            #map { height: 54vh; min-height: 360px; flex: none; order: 1; }
        }
        @media (max-width: 480px) {
            .map-header > .d-flex { flex-wrap: wrap; }
            .map-header h1 { flex: 1 1 auto; min-width: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header class="map-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="fa-solid fa-map me-2" aria-hidden="true"></i>TRACES MAP</h1>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-clock me-1" aria-hidden="true"></i> Timeline</a>
                <a href="/admin.html" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-gear me-1" aria-hidden="true"></i> Admin</a>
            </div>
        </div>
    </header>
    <div class="map-container">
        <div id="map"></div>
        <div class="map-sidebar" id="sidebar">
            <h3><i class="fa-solid fa-list me-2" aria-hidden="true"></i>Events on Map</h3>
            <div class="mb-3">
                <input type="text" class="form-control form-control-sm" id="location-filter" placeholder="Filter by location..." autocomplete="off">
            </div>
            <p class="small text-muted mb-2">This is the canonical map (Carto <code>light_all</code> + clustering) — also available as the Map overlay on <a href="/#map">Timeline → Map</a>. Share a location with <code>?lat=&amp;lng=&amp;zoom=&amp;id=</code>.</p>
            <div id="event-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="/static/js/map.js"></script>
</body>
</html>
