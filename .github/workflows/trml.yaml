name: trml

on:
  workflow_call:
  pull_request:

jobs:
  lint:
    name: TRMNL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
      - run: gem install trmnl_preview
      - run: trmnlp lint --dir trmnl

  push:
    name: TRMNL push
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
      - run: gem install trmnl_preview
      - name: Bootstrap or require TRMNL plugin ID
        run: |
          plugin_id=$(ruby -e 'require "yaml"; puts YAML.load_file("trmnl/src/settings.yml")["id"].to_s.strip')
          if [ -n "$plugin_id" ]; then
            echo "TRMNL plugin ID: $plugin_id"
            exit 0
          fi

          echo "::warning::No plugin ID set in trmnl/src/settings.yml. Creating a new TRMNL plugin..."
          output=$(trmnlp push --force --dir trmnl 2>&1 || true)
          echo "$output"
          new_id=$(printf '%s\n' "$output" | grep -oE '/plugin_settings/[0-9]+/edit' | grep -oE '[0-9]+' | tail -1)
          if [ -n "$new_id" ]; then
            echo "::error::Created TRMNL plugin with ID $new_id. Add 'id: $new_id' to trmnl/src/settings.yml and commit it so future pushes update this plugin instead of creating new ones."
            exit 1
          fi
          echo "::error::Could not extract the created plugin ID from the push output. Check the TRMNL dashboard for the new plugin and set its ID in trmnl/src/settings.yml."
          exit 1
        env:
          TRMNL_API_KEY: ${{ secrets.TRML_TOKEN }}
      - run: trmnlp push --force --dir trmnl
        env:
          TRMNL_API_KEY: ${{ secrets.TRML_TOKEN }}
